<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes Petdex</title>
<style>
:root{--bg:#05060a;--cyan:#00D4FF;--purple:#8B5CF6;--white:#fff;--gray:#4A4A4A;--card:#0d1020}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#12082e 0%,var(--bg) 55%);color:var(--white);font-family:'Space Grotesk','Inter',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
header{margin-bottom:22px}
.logo{font-size:26px;font-weight:800;letter-spacing:1px}
.logo .cyan{color:var(--cyan)}.logo .purp{color:var(--purple)}
.sub{color:#99a;font-size:14px;margin-top:4px;max-width:680px}
.count{display:inline-block;background:rgba(139,92,246,.15);border:1px solid var(--purple);color:var(--cyan);padding:2px 12px;border-radius:20px;font-size:13px;margin-left:10px;vertical-align:middle}
.filters{background:rgba(13,16,32,.7);border:1px solid #2a2f4a;border-radius:16px;padding:16px 18px;margin-bottom:24px;backdrop-filter:blur(6px)}
.fgroup{margin-bottom:12px}
.fgroup label{display:block;font-size:11px;letter-spacing:1.5px;color:var(--cyan);font-weight:700;margin-bottom:6px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#151a33;border:1px solid #2a2f4a;color:#cdd;padding:4px 11px;border-radius:20px;font-size:12px;cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--cyan)}
.chip.active{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:700}
.search{display:flex;gap:8px;margin-bottom:6px}
.search input{flex:1;background:#151a33;border:1px solid #2a2f4a;color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;outline:none}
.search input:focus{border-color:var(--cyan)}
.sortbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sortbar .res{color:#99a;font-size:13px}
.sortbar .sortbtn{background:#151a33;border:1px solid #2a2f4a;color:#cdd;padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.sortbar .sortbtn:hover{border-color:var(--cyan)}
.sortbar .sortbtn.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.clear{margin-top:8px;color:var(--cyan);background:none;border:none;cursor:pointer;font-size:12px;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:var(--card);border:1px solid #232844;border-radius:12px;padding:9px;cursor:pointer;transition:.18s;text-align:center;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 8px 24px rgba(0,212,255,.15)}
.card .art{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#000;border-radius:9px;overflow:hidden}
.card img{max-width:90%;max-height:90%;object-fit:contain}
.card img.pix{image-rendering:pixelated}
.card .art.ph{background:linear-gradient(135deg,#0d1330,#05060a);color:#556;font-size:28px;display:flex;align-items:center;justify-content:center}
.card .nm{font-size:11px;font-weight:600;margin-top:6px;color:#eef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ct{font-size:9px;color:#889;margin-top:2px;text-transform:capitalize}
.card .uq{position:absolute;top:5px;left:5px;font-size:7px;background:rgba(139,92,246,.2);color:#dcc6ff;padding:1px 5px;border-radius:7px;text-transform:uppercase;letter-spacing:.4px}
.loadmore{grid-column:1/-1;text-align:center;padding:18px}
.loadmore button{background:#151a33;border:1px solid var(--cyan);color:var(--cyan);padding:11px 28px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.loadmore button:hover{background:rgba(0,212,255,.12)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:#0a0d1c;border:1px solid var(--purple);border-radius:22px;max-width:500px;width:92%;overflow:hidden;box-shadow:0 0 60px rgba(139,92,246,.35);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{background:linear-gradient(135deg,#1a0b3a,#0a0d1c);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2f4a}
.modal-head h2{font-size:19px}
.modal-head .close{cursor:pointer;background:#151a33;border:none;color:#fff;font-size:18px;width:30px;height:30px;border-radius:50%;line-height:1}
.modal-head .close:hover{background:#2a2f4a}
.stage{height:230px;background:radial-gradient(500px 220px at 50% 0%,#0d1330 0%,#000 70%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stage img{max-height:170px;max-width:90%;object-fit:contain}
.stage img.pix{image-rendering:pixelated}
.stage-tag{position:absolute;top:12px;left:14px;font-size:10px;color:var(--cyan);background:rgba(0,212,255,.12);padding:2px 10px;border-radius:10px;letter-spacing:1.5px}
.modal-body{padding:18px 22px}
.m-cat{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.desc{font-size:13px;color:#bbc;line-height:1.55;min-height:38px}
.desc-real{font-size:13px;color:#cdd;line-height:1.5;margin-top:10px;font-style:italic}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tagrow .tag{background:#151a33;border:1px solid #2a2f4a;color:#cdd;padding:3px 9px;border-radius:14px;font-size:11px}
.tagrow .tag.uni{border-color:var(--purple);color:#dcc6ff}
.install{display:block;width:100%;text-align:center;background:linear-gradient(90deg,var(--cyan),#5a6bff);color:#000;border:none;padding:13px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;transition:.15s}
.install:hover{opacity:.9}
.install code{background:rgba(0,0,0,.35);color:#fff;padding:2px 7px;border-radius:6px;font-size:12px}
.install.copied{background:linear-gradient(90deg,#00d49a,#00D4FF)}
.empty{grid-column:1/-1;text-align:center;color:#889;padding:50px;font-size:15px}
.footer{text-align:center;color:#667;font-size:12px;margin-top:40px;padding-top:18px;border-top:1px solid #1a1f35}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">HERMES <span class="cyan">PET</span><span class="purp">DEX</span><span class="count" id="ct">4824</span></div>
  <div class="sub">Descubre mascotas de Hermes por lo que <b>son</b>: universo, estilo y tipo. Explora, compara e instala con un click.</div>
</header>

<div class="filters">
  <div class="fgroup search"><input id="q" type="text" placeholder="Buscar por nombre, universo, descripción…  ej: pokemon, mecha girl, cozy dragon"></div>
  <div class="fgroup"><label>Categoría</label><div class="chips" id="f-cat"></div></div>
  <div class="fgroup"><label>Universo / franquicia</label><div class="chips" id="f-univ"></div></div>
  <div class="fgroup"><label>Origen</label><div class="chips" id="f-orig"></div></div>
  <div class="fgroup"><label>Estilo visual</label><div class="chips" id="f-style"></div></div>
  <div class="fgroup"><label>Tipo</label><div class="chips" id="f-cre"></div></div>
  <button class="clear" id="clr">limpiar filtros</button>
</div>

<div class="sortbar">
  <span class="res" id="res"></span>
  <button class="sortbtn" id="sort-feat">Reconocibles primero</button>
  <button class="sortbtn" id="sort-shuffle">Sorpréndeme 🎲</button>
</div>

<div class="grid" id="grid"></div>

<div class="footer">Hermes Petdex · 4,824 mascotas del gallery petdex.dev · curaduría + etiquetado semántico</div>
</div>

<div class="overlay" id="ov">
  <div class="modal">
    <div class="modal-head"><h2 id="m-title"></h2><button class="close" id="m-close">✕</button></div>
    <div class="stage"><div class="stage-tag">PET</div><div id="m-stage"></div></div>
    <div class="modal-body">
      <div class="m-cat" id="m-cat"></div>
      <div class="tagrow" id="m-tags"></div>
      <div class="desc-real" id="m-desc-real"></div>
      <button class="install" id="m-install">install</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
let sel={cat:new Set(),universe:new Set(),origin:new Set(),style:new Set(),creature:new Set()};
let sortMode='feat'; // feat | shuffle
let shownCount=120;
const $=id=>document.getElementById(id);

function buildChips(){
  const opts={cat:new Set(),universe:new Set(),origin:new Set(),style:new Set(),creature:new Set()};
  PETS.forEach(p=>{if(p.cat)opts.cat.add(p.cat);(p.universe||[]).forEach(v=>opts.universe.add(v));(p.origin||[]).forEach(v=>opts.origin.add(v));(p.style||[]).forEach(v=>opts.style.add(v));(p.creature||[]).forEach(v=>opts.creature.add(v));});
  const map=[['f-cat','cat'],['f-univ','universe'],['f-orig','origin'],['f-style','style'],['f-cre','creature']];
  map.forEach(([id,k])=>{
    const el=$(id);el.innerHTML='';
    const vals=[...opts[k]].sort();
    vals.forEach(v=>{
      const c=document.createElement('span');c.className='chip';c.textContent=v;
      c.onclick=()=>{const set=sel[k];set.has(v)?set.delete(v):set.add(v);c.classList.toggle('active');shownCount=120;render();};
      el.appendChild(c);
    });
  });
}
function matches(p){
  if(sel.cat.size&&!sel.cat.has(p.cat))return false;
  if(sel.universe.size&&!(p.universe||[]).some(v=>sel.universe.has(v)))return false;
  if(sel.origin.size&&!(p.origin||[]).some(v=>sel.origin.has(v)))return false;
  if(sel.style.size&&!(p.style||[]).some(v=>sel.style.has(v)))return false;
  if(sel.creature.size&&!(p.creature||[]).some(v=>sel.creature.has(v)))return false;
  const q=$('q').value.trim().toLowerCase();
  if(q){const hay=p.name+' '+p.slug+' '+(p.creature||[]).join(' ')+' '+(p.universe||[]).join(' ')+' '+(p.origin||[]).join(' ')+' '+(p.style||[]).join(' ')+' '+(p.desc||'');if(!hay.toLowerCase().includes(q))return false;}
  return true;
}
function currentList(){
  let list=PETS.filter(matches);
  if(sortMode==='feat'){
    // reconocibles primero, luego por identity
    list=list.slice().sort((a,b)=>(b.tag==='reconocible')-(a.tag==='reconocible')||(b.identity||0)-(a.identity||0));
  }else if(sortMode==='shuffle'){
    list=list.slice().sort(()=>Math.random()-0.5);
  }
  return list;
}
function render(){
  const list=currentList();
  const shown=list.slice(0,shownCount);
  $('ct').textContent=PETS.length;
  $('res').textContent=shown.length+' / '+list.length+' mascotas';
  const g=$('grid');
  if(!list.length){g.innerHTML='<div class="empty">No mascotas coinciden con esos filtros.</div>';return;}
  g.innerHTML=shown.map(p=>{
    const uq=(p.universe||[]).slice(0,1).map(u=>'<span class="uq">'+u+'</span>').join('');
    const isPix=(p.style||[]).includes('pixel');
    const art='<img src="assets/thumbs/'+p.slug+'.webp" alt="'+p.name+'"'+(isPix?' class="pix"':'')+'>';
    return '<div class="card" onclick="openPet(\''+p.slug+'\')"><div class="art">'+art+'</div><div class="nm">'+p.name+'</div><div class="ct">'+p.cat+'</div>'+uq+'</div>';
  }).join('');
  if(list.length>shownCount){
    g.innerHTML+='<div class="loadmore"><button onclick="shownCount+=240;render()">Cargar más ('+(list.length-shownCount)+' restantes)</button></div>';
  }
}
function openPet(slug){
  const p=PETS.find(x=>x.slug===slug);if(!p)return;
  $('m-title').textContent=p.name;
  $('m-cat').textContent=p.cat+(p.author?' · '+p.author:'');
  const arr=[].concat(p.universe||[],p.style||[],p.creature||[]);
  const isuni=t=>(p.universe||[]).indexOf(t)>=0;
  $('m-tags').innerHTML=arr.map(t=>'<span class="tag '+(isuni(t)?'uni':'')+'">'+t+'</span>').join('');
  const isPix=(p.style||[]).includes('pixel');
  $('m-stage').innerHTML='<img src="assets/thumbs/'+p.slug+'.webp" alt="'+p.name+'"'+(isPix?' class="pix"':'')+'>';
  $('m-desc-real').textContent=p.desc||'';
  $('m-install').innerHTML='Copiar: hermes pets install <code>'+p.slug+'</code>';
  $('m-install').classList.remove('copied');
  $('m-install').onclick=()=>{
    const t='hermes pets install '+p.slug;
    if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>{const o=$('m-install');o.innerHTML='✓ Copiado';o.classList.add('copied');setTimeout(()=>{o.innerHTML='Copiar: hermes pets install <code>'+p.slug+'</code>';o.classList.remove('copied')},1500);});}
  };
  $('ov').classList.add('open');
}
$('m-close').onclick=()=>$('ov').classList.remove('open');
$('ov').onclick=e=>{if(e.target.id==='ov')$('ov').classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('ov').classList.remove('open')});
$('q').addEventListener('input',()=>{shownCount=120;render()});
$('sort-feat').onclick=()=>{sortMode='feat';document.getElementById('sort-shuffle').classList.remove('active');this.classList.add('active');shownCount=120;render()};
$('sort-shuffle').onclick=()=>{sortMode='shuffle';document.getElementById('sort-feat').classList.remove('active');this.classList.add('active');shownCount=120;render()};
$('sort-feat').classList.add('active');
$('clr').onclick=()=>{sel={cat:new Set(),universe:new Set(),origin:new Set(),style:new Set(),creature:new Set()};$('q').value='';document.querySelectorAll('.chip.active').forEach(c=>c.classList.remove('active'));shownCount=120;render();};
buildChips();render();
</script>
</body>
</html>
